<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>PALURU 更新</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:32px;background:#f7f7fb;color:#222}
    main{max-width:560px;margin:18vh auto 0}
    h1{font-size:2rem}
    p{font-size:1.1rem;line-height:1.7}
  </style>
</head>
<body>
<main>
  <h1>PALURUを更新中…</h1>
  <p id="status">古い登録状態とキャッシュを整理しています。</p>
</main>
<script>
(async () => {
  const status = document.getElementById("status");
  try {
    localStorage.removeItem("paruru-mini-home-control-pending-v1");
    sessionStorage.clear();
    if ("serviceWorker" in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map((registration) => registration.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter((key) => key.startsWith("paruru-mini-")).map((key) => caches.delete(key)));
    }
    status.textContent = "更新できました。PALURUを開き直します。";
  } catch (error) {
    status.textContent = "更新処理を続けます。";
  }
  const target = new URL("./", location.href);
  target.searchParams.set("fresh", "v20260919-registration-recovery");
  target.searchParams.set("t", Date.now().toString());
  location.replace(target.toString());
})();
</script>
</body>
</html>
