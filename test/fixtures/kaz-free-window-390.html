<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TODAY Free Window 390px preview</title>
<link rel="stylesheet" href="../../features/kaz-os/personal.css">
<style>body{box-sizing:border-box;width:390px;max-width:100%;margin:0;padding:16px;font-family:system-ui,sans-serif;background:#fff}#kazPersonalContent{width:100%}</style>
</head><body><main id="kazPersonalContent"></main>
<script src="../../features/kaz-os/today.js"></script>
<script src="../../features/kaz-os/inbox.js"></script>
<script src="../../features/kaz-os/personal.js"></script>
<script>
const now=new Date();
const date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
const time=value=>`${date}T${value}:00+09:00`;
const candidate=(id,title,minutes)=>({id,work_id:`WI-${id.slice(-2)}`,title,state:'READY',project_name:'PALURU',
  priority:'HIGH',planning_preference:null,estimate_min:minutes,action_type:'ACTION',next_action:'',blocker:''});
const work=[candidate('00000000-0000-4000-8000-000000000001','会社の資料を確認して返信する',15),
  candidate('00000000-0000-4000-8000-000000000002','議事録の下書きをまとめる',30),
  candidate('00000000-0000-4000-8000-000000000003','長い名前のWorkでも折り返して読めることを確認する',60)];
const slot=(start,end,minutes,suggestions)=>({start:time(start),end:time(end),duration_min:minutes,suggestions});
KazPersonalView.render(document.getElementById('kazPersonalContent'),{page:'today'}, {
  schema_version:'kaz-today-plan-v2',origin:'real_operational_sources',sources:{
    work_items:{status:'ok',complete:true,fetched_at:now.toISOString(),valid_until:new Date(now.getTime()+600000).toISOString(),
      source_revision:'fixture',scope:'390px preview'},work_busy:{status:'ok'}},
  today:{now:{kind:'none',items:[]},next:{kind:'none',items:[]},scheduled:[],waiting:[],waiting_count:0,
    not_fit_today:[],not_fit_today_count:0,availability:[],calendar_state:{unknown_count:0,unknown:[]},
    company_free_windows:[slot('09:00','10:30',90,work),slot('11:00','11:30',30,work.slice(0,2))],
    calendar_free_windows:[slot('13:00','14:00',60,work)],preference_count:0,daily_estimate_count:0,
    missing_estimate_count:0,active_count:3,done_count:0,cancelled_count:0}},now.getTime());
</script></body></html>
