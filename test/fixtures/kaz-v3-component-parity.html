<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaz OS same-condition component check</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../features/kaz-os/personal.css">
</head>
<body>
  <section id="kazOsView" class="app-view is-active" data-view="kaz-os" aria-label="今日の予定">
    <div class="kaz-heading"><h1 id="kazOsTitle">Kaz OS</h1></div>
    <nav id="kazOsNav" class="kp-nav" aria-label="Kaz OS">
      <a href="#kaz-os/today" data-kaz-page="today" aria-current="page">TODAY</a>
      <a href="#kaz-os/work" data-kaz-page="work">WORK</a>
      <a href="#kaz-os/projects" data-kaz-page="projects">PROJECTS</a>
      <a href="#kaz-os/capa" data-kaz-page="capa">CAPA</a>
      <a href="#kaz-os/inbox" data-kaz-page="inbox">INBOX</a>
    </nav>
    <div id="kazPersonalContent" aria-live="polite"></div>
  </section>
  <script src="../../features/kaz-os/inbox.js"></script>
  <script src="../../features/kaz-os/today.js"></script>
  <script src="../../features/kaz-os/personal.js"></script>
  <script src="../../features/kaz-os/v3-component-data.js"></script>
  <script src="./kaz-v3-component-parity.js"></script>
  <script>
    const pair = KazV3ParityFixture.create();
    const mode = new URLSearchParams(location.search).get('mode');
    const oldData = pair.dashboard.component_data.today;
    const data = mode === 'snapshot'
      ? KazV3ComponentData.dashboard(pair.dashboard, 'today') : oldData;
    KazPersonalView.render(document.getElementById('kazPersonalContent'),
      { page: 'today', id: null }, data, Date.parse('2026-10-09T14:30:00+09:00'));
    document.documentElement.dataset.mode = mode === 'snapshot' ? 'snapshot' : 'old';
  </script>
</body>
</html>
