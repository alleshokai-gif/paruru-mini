<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Inbox Review UI fixture</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    body { margin: 0; background: #f3f4fb; }
    .review-acceptance-shell { box-sizing: border-box; width: min(390px, 100%); min-height: 844px; margin: 0 auto; padding: 8px; }
    .review-acceptance-shell .family-inbox-review-dialog { box-sizing: border-box; position: static; display: block; margin: 0 auto; }
    #acceptanceMetrics { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  </style>
</head>
<body>
  <main class="review-acceptance-shell">
    <section class="app-dialog family-inbox-review-dialog" aria-labelledby="fixtureHeading">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Family Inbox</p>
          <h2 id="fixtureHeading">学校プリントを確認</h2>
          <p class="family-inbox-review-document-meta">対象メンバー・synthetic-notice.png・8/31受付</p>
        </div>
        <button class="ghost-button" type="button">閉じる</button>
      </div>
      <p class="family-inbox-review-dialog-status is-success">このプリントから5件見つけたで。</p>
      <div class="family-inbox-review-candidates">
        <details class="family-inbox-candidate-card" open>
          <summary class="family-inbox-candidate-summary"><div><strong>書類：2学期のお知らせ</strong><p>発行日 2026-08-28</p></div><span class="family-inbox-candidate-state">確認待ち</span></summary>
          <div class="family-inbox-candidate-body">
            <span class="family-inbox-confidence">読み取り済み</span>
            <div class="family-inbox-candidate-fields">
              <label class="field"><span>書類名</span><input type="text" value="2学期のお知らせ"></label>
              <label class="field"><span>発行日</span><input type="date" value="2026-08-28"></label>
              <label class="field"><span>書類の種類</span><select><option selected>お知らせ</option></select></label>
            </div>
            <details class="family-inbox-evidence"><summary>元の記載を見る</summary><blockquote>2学期のお知らせ</blockquote></details>
            <label class="field"><span>確認メモ（任意）</span><textarea rows="2"></textarea></label>
            <div class="family-inbox-candidate-actions"><button class="secondary-button" type="button">修正を保存</button><button type="button">承認する</button><button class="danger-button" type="button">却下する</button></div>
            <div class="family-inbox-reject-fields"><label class="field"><span>却下理由</span><select><option>選んでな</option></select></label></div>
          </div>
        </details>
        <details class="family-inbox-candidate-card"><summary class="family-inbox-candidate-summary"><div><strong>予定：始業式</strong><p>2026-09-03 08:15</p></div><span class="family-inbox-candidate-state">確認待ち</span></summary></details>
        <details class="family-inbox-candidate-card"><summary class="family-inbox-candidate-summary"><div><strong>予定：身体測定</strong><p>2026-09-10 時刻なし</p></div><span class="family-inbox-candidate-state">確認待ち</span></summary></details>
        <details class="family-inbox-candidate-card"><summary class="family-inbox-candidate-summary"><div><strong>予定：遠足</strong><p>2026-09-12 08:00</p></div><span class="family-inbox-candidate-state">確認待ち</span></summary></details>
        <details class="family-inbox-candidate-card"><summary class="family-inbox-candidate-summary"><div><strong>持ち物：上履き、防災頭巾、夏休みの宿題</strong><p>2026-09-03</p></div><span class="family-inbox-candidate-state">確認待ち</span></summary></details>
      </div>
    </section>
    <output id="acceptanceMetrics"></output>
  </main>
  <script>
    addEventListener('load', function() {
      const shell = document.querySelector('.review-acceptance-shell');
      const controls = Array.from(document.querySelectorAll('button, input, select, textarea, summary'));
      const metrics = {
        testWidth: shell.getBoundingClientRect().width,
        testHeight: shell.getBoundingClientRect().height,
        horizontalOverflow: shell.scrollWidth > shell.clientWidth,
        candidateCount: document.querySelectorAll('.family-inbox-candidate-card').length,
        minimumControlHeight: Math.min.apply(null, controls.map(function(item) { return item.getBoundingClientRect().height; })),
        minimumInputFontSize: Math.min.apply(null, Array.from(document.querySelectorAll('input, select, textarea')).map(function(item) { return parseFloat(getComputedStyle(item).fontSize); })),
        rawJsonVisible: document.body.innerText.indexOf('{\"') >= 0,
      };
      document.documentElement.setAttribute('data-acceptance-metrics', JSON.stringify(metrics));
      document.getElementById('acceptanceMetrics').textContent = JSON.stringify(metrics);
    });
  </script>
</body>
</html>
