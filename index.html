<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#5C6BC0">
    <title>Paruru Mini</title>
    <link rel="manifest" href="./manifest.json?v=20260710-05">
    <link rel="icon" href="./assets/icons/favicon.png?v=20260710-05" type="image/png">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png?v=20260710-05">
    <link rel="stylesheet" href="./style.css?v=20260710-05">
  </head>
  <body>
    <div id="splash" class="splash" aria-label="Loading">
      <img class="splash-icon" src="./assets/character/official/paruru_face.png?v=20260710-05" alt="ぱるる">
      <p class="splash-logo">Paruru</p>
      <p class="splash-loading">Loading...</p>
    </div>

    <main class="app-shell">
      <section class="paruru">
        <img id="paruruImage" class="paruru-image" src="./assets/character/official/paruru_bust.png?v=20260710-05" alt="ぱるる">
        <p class="paruru-line">……メモしとく？</p>
      </section>

      <section id="homeView" class="app-view is-active" data-view="home">
        <form id="inboxForm" class="inbox-form">
          <label class="field">
            <span>思いついたことを書く</span>
            <textarea id="memo" name="memo" rows="7" placeholder="牛乳買う" required></textarea>
          </label>

          <label class="field">
            <span>カテゴリ</span>
            <select id="category" name="category">
              <option value="未分類">未分類</option>
              <option value="家">家</option>
              <option value="仕事">仕事</option>
              <option value="買い物">買い物</option>
              <option value="学校">学校</option>
              <option value="薬局">薬局</option>
              <option value="開発">開発</option>
              <option value="お金">お金</option>
            </select>
          </label>

          <fieldset class="priority-group">
            <legend>優先度</legend>
            <label>
              <input type="radio" name="priority" value="Low">
              <span>Low</span>
            </label>
            <label>
              <input type="radio" name="priority" value="Normal" checked>
              <span>Normal</span>
            </label>
            <label>
              <input type="radio" name="priority" value="High">
              <span>High</span>
            </label>
          </fieldset>

          <button id="submitButton" type="submit">ぱるるに預ける</button>
        </form>

        <section id="homeFollowup" class="followup-panel is-hidden" aria-live="polite">
          <p class="followup-label">確認したいこと</p>
          <p id="homeFollowupQuestion" class="followup-question"></p>
          <label class="field">
            <span>回答</span>
            <input id="homeFollowupAnswer" type="text" placeholder="明日">
          </label>
          <div class="followup-actions">
            <button id="homeFollowupLater" class="secondary-button" type="button">あとで</button>
            <button id="homeFollowupSubmit" type="button">回答する</button>
          </div>
        </section>
      </section>

      <section id="inboxView" class="app-view" data-view="inbox">
        <div class="view-header">
          <h1>Inbox</h1>
          <button id="refreshInboxButton" class="icon-button" type="button" aria-label="Inboxを更新">↻</button>
        </div>
        <div id="inboxList" class="inbox-list" aria-live="polite"></div>
      </section>

      <section id="settingsView" class="app-view" data-view="settings">
        <div class="settings-placeholder">
          <h1>設定</h1>
          <p>設定はまだ仮だよ。</p>
          <p id="buildVersion" class="build-version">Build loading...</p>
        </div>
      </section>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-item is-active" type="button" data-target-view="home">ホーム</button>
      <button class="nav-item" type="button" data-target-view="inbox">Inbox</button>
      <button class="nav-item" type="button" data-target-view="settings">設定</button>
    </nav>

    <dialog id="detailDialog" class="app-dialog">
      <form id="editForm" class="edit-form" method="dialog">
        <input id="editId" type="hidden">
        <div class="dialog-header">
          <h2>詳細</h2>
          <button class="ghost-button" type="button" data-close-dialog="detailDialog">閉じる</button>
        </div>

        <label class="field">
          <span>タイトル</span>
          <input id="editTitle" type="text" maxlength="60">
        </label>

        <label class="field">
          <span>メモ</span>
          <textarea id="editMemo" rows="6" required></textarea>
        </label>

        <label class="field">
          <span>カテゴリ</span>
          <select id="editCategory">
            <option value="未分類">未分類</option>
            <option value="家">家</option>
            <option value="仕事">仕事</option>
            <option value="買い物">買い物</option>
            <option value="学校">学校</option>
            <option value="薬局">薬局</option>
            <option value="開発">開発</option>
            <option value="お金">お金</option>
          </select>
        </label>

        <label class="field">
          <span>優先度</span>
          <select id="editPriority">
            <option value="Low">Low</option>
            <option value="Normal">Normal</option>
            <option value="High">High</option>
          </select>
        </label>

        <section id="detailFollowup" class="followup-panel is-hidden" aria-live="polite">
          <p class="followup-label">確認したいこと</p>
          <p id="detailFollowupQuestion" class="followup-question"></p>
          <label class="field">
            <span>回答</span>
            <input id="detailFollowupAnswer" type="text" placeholder="明日">
          </label>
          <div class="followup-actions">
            <button id="detailFollowupLater" class="secondary-button" type="button">あとで</button>
            <button id="detailFollowupSubmit" type="button">回答する</button>
          </div>
        </section>

        <div class="dialog-actions">
          <button id="deleteButton" class="danger-button" type="button">削除</button>
          <button id="doneButton" class="secondary-button" type="button">完了</button>
          <button id="saveEditButton" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="deleteDialog" class="app-dialog confirm-dialog">
      <div class="dialog-header">
        <h2>削除</h2>
      </div>
      <p>このメモを消す？</p>
      <div class="dialog-actions">
        <button class="secondary-button" type="button" data-close-dialog="deleteDialog">やめる</button>
        <button id="confirmDeleteButton" class="danger-button" type="button">削除</button>
      </div>
    </dialog>

    <script src="./app.js?v=20260710-05" defer></script>
  </body>
</html>
