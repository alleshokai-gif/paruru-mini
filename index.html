<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#5C6BC0">
    <title>Paruru Mini</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icons/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="paruru">
        <img class="paruru-image" src="assets/character/paruru.svg" alt="ぱるる">
        <p class="paruru-line">……メモしとく？</p>
      </section>

      <form id="inboxForm" class="inbox-form">
        <label class="field">
          <span>思いついたことを書く</span>
          <textarea id="memo" name="memo" rows="7" placeholder="牛乳買う" required></textarea>
        </label>

        <label class="field">
          <span>カテゴリ</span>
          <select id="category" name="category">
            <option value="未分類">未分類</option>
            <option value="家">家</option>
            <option value="仕事">仕事</option>
            <option value="買い物">買い物</option>
            <option value="学校">学校</option>
            <option value="薬局">薬局</option>
            <option value="開発">開発</option>
            <option value="お金">お金</option>
          </select>
        </label>

        <fieldset class="priority-group">
          <legend>優先度</legend>
          <label>
            <input type="radio" name="priority" value="Low">
            <span>Low</span>
          </label>
          <label>
            <input type="radio" name="priority" value="Normal" checked>
            <span>Normal</span>
          </label>
          <label>
            <input type="radio" name="priority" value="High">
            <span>High</span>
          </label>
        </fieldset>

        <button id="submitButton" type="submit">ぱるるに預ける</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
