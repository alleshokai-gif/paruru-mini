name: WI60 degraded TODAY focused validation
on:
  push:
    branches: [feat/wi60-today-degraded-display]
    paths:
      - 'features/kaz-os/personal.js'
      - 'features/kaz-os/v3-component-data.js'
      - 'test/kaz-v3-degraded-today.test.js'
      - 'test/kaz-v3-inline-preview.test.js'
      - '.github/workflows/wi60-temporary-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check features/kaz-os/personal.js
          node --check features/kaz-os/v3-component-data.js
          node --check test/kaz-v3-degraded-today.test.js
      - name: Focused V3 / fallback contract suite
        run: |
          node test/kaz-v3-degraded-today.test.js
          node test/kaz-v3-inline-preview.test.js
          node test/kaz-v3-navigation-component.test.js
          node test/kaz-today-navigation.test.js
