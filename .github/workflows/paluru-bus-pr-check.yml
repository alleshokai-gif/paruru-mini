name: PALURU bus PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bus-ui:
    name: PALURU bus UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run the bus UI suite
        run: node --test test/bus-home-route-ui.test.js
      - name: Run the Family Inbox acceptance suite
        run: node --test test/family-inbox-acceptance.test.js
