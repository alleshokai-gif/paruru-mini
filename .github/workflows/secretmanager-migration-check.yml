name: Secret Manager migration check
on:
  push:
    branches:
      - feat/kaz-os-secretmanager-read-token
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run targeted Kaz OS tests
        run: |
          node test/kaz-secret-manager.test.js
          node test/kaz-projects.test.js
          node test/kaz-work.test.js
          node test/kaz-capa.test.js
          node test/kaz-today-v1.test.js
          node test/kaz-inbox-live.test.js
