name: Publish verified WI-23 branch once

on:
  push:
    branches: [automation/wi23-publish-once]

permissions:
  contents: read

concurrency:
  group: wi23-verified-publication

jobs:
  verify:
    if: github.repository == 'alleshokai-gif/paruru-mini'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify the saved patch and run the bus suite
        run: |
          echo '007519a8d438186a746c065f6c75b490dd6e493c5f7011954a77176813bf1a3b  .github/wi23/verified.patch' | sha256sum -c
          git apply --check .github/wi23/verified.patch
          git apply .github/wi23/verified.patch
          git diff --check
          node --test test/bus-home-route-ui.test.js
  publish:
    if: github.repository == 'alleshokai-gif/paruru-mini'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the fixed review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=https://github.com/alleshokai-gif/paruru-mini.git
          base=c20f989dbcdce62f06359b009cce0bba5f9fa3b8
          ci=6c4a9af5bf1c3a3f8998b11cf359da33e132378d
          target=refs/heads/review/wi23-verified
          test "$(git ls-remote "$repo" refs/heads/main | cut -f1)" = "$base"
          test "$(git ls-remote "$repo" refs/heads/ci/paluru-bus-pr-check | cut -f1)" = "$ci"
          test -z "$(git ls-remote "$repo" "$target")"
          echo '007519a8d438186a746c065f6c75b490dd6e493c5f7011954a77176813bf1a3b  .github/wi23/verified.patch' | sha256sum -c
          cp .github/wi23/verified.patch "$RUNNER_TEMP/wi23.patch"
          git switch --detach "$ci"
          git apply --check "$RUNNER_TEMP/wi23.patch"
          git apply "$RUNNER_TEMP/wi23.patch"
          git diff --check
          printf '%s\n' features/bus/home-route.js test/bus-home-route-ui.test.js > "$RUNNER_TEMP/expected"
          git diff --name-only > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -am 'Show arrival difference on the comparable bus card'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "$repo" HEAD:"$target"
          test "$(git ls-remote "$repo" "$target" | cut -f1)" = "$(git rev-parse HEAD)"
