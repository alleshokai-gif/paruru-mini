<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PALURU Bus ローカル受入</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/features/bus/bus.css"><style>body{margin:0;background:#f4f7fb;font-family:system-ui,sans-serif}main{max-width:700px;margin:auto;padding:20px 16px}#testControls{background:#fff3d6;padding:12px;display:flex;gap:8px;flex-wrap:wrap}#testControls p{width:100%;margin:0;font-size:12px}button,select{min-height:48px;font-size:16px}#requestCount{font-size:12px}</style></head><body class="is-authenticated">
