# Build only. Deployment/public IAM changes are deliberately separate commands.
# No ODPT secret is available to this build or its image layers.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--platform=linux/amd64', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['run', '--detach', '--name', 'bus-build-smoke', '-e', 'ODPT_ACCESS_TOKEN=synthetic-build-health-only', '${_IMAGE}']
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        for attempt in {1..15}; do
          if docker exec bus-build-smoke node --input-type=module -e '
            import assert from "node:assert/strict";
            import { existsSync, readFileSync } from "node:fs";
            const r = await fetch("http://127.0.0.1:8080/health");
            assert.equal(r.status,200); assert.equal((await r.json()).status,"ok");
            assert.equal(existsSync("/app/.dev.vars"),false);
            const {loadShadowPosition}=await import("/app/runtime/shadow-position.js");
            const p0=JSON.parse(readFileSync("/app/generated/p0-static.json"));
            const positionStatic=JSON.parse(readFileSync("/app/generated/p1-position-static.json"));
            const shadow=loadShadowPosition({index:p0,positionStatic});
            assert.equal(shadow.status,"shadow_geometry_loaded");
            assert.equal(shadow.stats.supportedChains,2);
            assert.equal(shadow.stats.sharedCorridorChains,1);
            assert.deepEqual(shadow.stats.geometrySources,["validated_road_geometry"]);
            assert.equal(shadow.stats.approvedForPublic,false);
            assert.equal(shadow.stats.geometryReady,false);
            const jr=JSON.parse(readFileSync("/app/release-static/rail-nambu-challenge-static.json"));
            const odakyu=JSON.parse(readFileSync("/app/release-static/rail-odakyu-static.json"));
            assert.equal(jr.sample,false); assert.equal(odakyu.sample,false);
            assert.equal(jr.trains.filter(x=>x.calendarType==="weekday").length,83);
            assert.equal(jr.trains.filter(x=>x.calendarType==="weekend").length,81);
            assert.equal(odakyu.trains.filter(x=>x.calendarType==="weekday").length,69);
            assert.equal(odakyu.trains.filter(x=>x.calendarType==="weekend").length,71);
            const university=await fetch("http://127.0.0.1:8080/api/bus/trains?journeyId=university");
            const school=await fetch("http://127.0.0.1:8080/api/bus/trains?journeyId=high_school");
            assert.equal(university.status,200); assert.equal(school.status,200);
            assert.equal((await university.json()).trains.length,5);
            assert.equal((await school.json()).trains.length,5);
            assert.equal(existsSync("/app/scripts"),false);
            assert.equal(existsSync("/app/node_modules/fflate"),false);
            assert.equal(process.versions.node.split(".")[0],"24");
            const denied = await fetch("http://127.0.0.1:8080/health",{headers:{Origin:"http://localhost:8788"}});
            assert.equal(denied.status,403);
            console.log(JSON.stringify({status:"IMAGE_HEALTH_PASS",nodeVersion:process.versions.node}));
          '; then docker rm -f bus-build-smoke; exit 0; fi
          sleep 1
        done
        docker rm -f bus-build-smoke
        exit 1
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
